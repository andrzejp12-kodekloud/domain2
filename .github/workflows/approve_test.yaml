name: Deploy feature pre-check

on:
  workflow_dispatch:
    inputs:
      env:
        description: Select env
        required: true
        type: choice
        options:
          - test
          - prod

jobs:
  job1:
    environment: "${{ inputs.env }}-1"
    name: Prepare job environment
    runs-on: ubuntu-latest
    steps:
      - name: Get RUNNER_LABEL
        id: get-runner-label
        run: echo "step1"

  job2:
    environment: "${{ inputs.env }}"
    if: ${{ inputs.env == 'test' }}
    needs:
      - job1
    name: Approval
    runs-on: ubuntu-latest
    steps:
      - name: Approval step
        id: step-approval-id
        run: echo "approval"
        
  job3:
    environment: "${{ inputs.env }}"
    if: ${{ needs.job2.result == 'success' || needs.job2.result == 'skipped' }}
    needs:
      - job1
      - job2
    name: Apply
    runs-on: ubuntu-latest
    steps:
      - name: Approval step
        id: step-approval-id
        run: echo "approval"
