name: Deploy with approval pre-check

on:
  workflow_dispatch:
    inputs:
      region:
        description: Select region
        required: true
        type: choice
        options:
          - sand_dev
          - sand_prd
permissions:
  actions: read # potrzebne do odczytu approvals
  deployments: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: test
    env:
      REQUIRED_TOKEN: ${{ inputs.region }}
      TARGET_ENVIRONMENT: test
    outputs:
      blocked_deployment: ${{ steps.approval_check.outputs.valid }}
    steps:
      - name: Minimal approval check
        id: approval_check
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = process.env.GITHUB_RUN_ID;
            const { owner, repo } = context.repo;
            const required = process.env.REQUIRED_TOKEN;
            const targetEnv = process.env.TARGET_ENVIRONMENT;

            // pobierz approvals
            const res = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/approvals',
              { owner, repo, run_id }
            );

            const approvals = Array.isArray(res.data) ? res.data : [];

            // wybierz zatwierdzenia dla środowiska
            const match = approvals.find(a =>
              (a.state || '').toLowerCase() === 'approved' &&
              (a.environments || []).some(e =>
                (e.name || '').toLowerCase() === targetEnv.toLowerCase()
              )
            );

            if (!match) {
              core.setOutput('valid', 'false');
              return;
            }

            const comment = (match.comment || '').trim();
            const ok = new RegExp(required, 'i').test(comment);

            core.setOutput('valid', ok ? 'true' : 'false');

  deploy:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.blocked_deployment == 'false' }}
    steps:
      - name: Deploy...
        run: echo "Deployuję po poprawnym pre-check..."
