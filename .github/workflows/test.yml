# This is a basic workflow to help you get started with Actions

name: Test

# Controls when the workflow will run
on:
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    environment: "test"
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Read environment approval comment
        id: read_comment
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = process.env.GITHUB_RUN_ID;
            const { owner, repo } = context.repo;

            // Pobranie historii approvals dla tego workflow run
            const res = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/approvals',
              { owner, repo, run_id }
            );

            const approvals = Array.isArray(res.data) ? res.data : [];
            const envName = 'test'.toLowerCase();

            // Znajdź APPROVE dla konkretnego environment
            const matched = approvals.filter(a =>
              (a.environment?.name || '').toLowerCase() === envName &&
              a.state === 'approved'
            );

            const comment = matched.length > 0
              ? matched[matched.length - 1].comment || ''
              : '';

            core.info(`COMMENT FROM APPROVAL: "${comment}"`);
            core.setOutput('comment', comment);
