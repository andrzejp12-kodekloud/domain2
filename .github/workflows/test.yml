name: Deploy with approval pre-check

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Select domain
        required: true
        type: choice
        options:
          - sand_dev
          - sand_prd
      env:
        description: Select environment
        required: true
        type: choice
        options:
          - test
          - prod
  workflow_call:
    inputs:
      env:
        description: Region
        required: true
        type: string
      domain:
        description: Domain name
        required: true
        type: string

# permissions:
#   actions: read
#   deployments: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    env:
      REQUIRED_STRING: "${{ inputs.domain }}-${{ inputs.env }}"
      TARGET_ENVIRONMENT: ${{ inputs.env }}
    outputs:
      deployment: ${{ steps.approval_check.outputs.valid }}
    steps:
      - name: Minimal approval check
        id: approval_check
        uses: actions/github-script@v8
        with:
          script: |
            const run_id = process.env.GITHUB_RUN_ID;
            const { owner, repo } = context.repo;
            const required = process.env.REQUIRED_STRING;
            const targetEnv = process.env.TARGET_ENVIRONMENT;

            const res = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/approvals',
              { owner, repo, run_id }
            );

            const approvals = Array.isArray(res.data) ? res.data : [];

            const match = approvals.find(a =>
              (a.state || '').toLowerCase() === 'approved' &&
              (a.environments || []).some(e =>
                (e.name || '').toLowerCase() === targetEnv.toLowerCase()
              )
            );

            if (!match) {
              core.setOutput('valid', 'false');
              return;
            }

            const comment = (match.comment || '').trim();
            const ok = new RegExp(required, 'i').test(comment);

            core.setOutput('valid', ok ? 'false' : 'true');

  deploy:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.deployment == 'true' }}
    steps:
      - name: Deploy...
        run: echo "Deployuję po poprawnym pre-check..."
